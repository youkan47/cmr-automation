name: CMR Data Auto-Sync

on:
  workflow_dispatch: # Allows you to tap "Run workflow" right from your phone's browser or GitHub app!

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install playwright requests
          playwright install chromium

      - name: Run Scraper Script
        run: python cmr_scraper.py
