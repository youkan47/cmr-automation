name: CMR Scraper & Generator

on:
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          pip install playwright requests pillow
          playwright install chromium
          
      - name: Run Scraper Script & Build Image
        run: python cmr_scraper.py

      - name: Upload Instagram Graphic Result
        uses: actions/upload-artifact@v4
        with:
          name: cmr-instagram-graphic
          path: instagram_post.png
